name: quality

on:
  pull_request:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-plane:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: Validate contracts
        run: |
          uv run libmpv-runtime contract validate
          uv run libmpv-runtime contract list
          uv run libmpv-runtime source list
      - name: Lint and type-check
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
      - name: Run hermetic tests with coverage gate
        run: >-
          uv run pytest
          --cov=libmpv_runtime
          --cov-report=term-missing
          --cov-fail-under=80
      - name: Build and inspect the distributable wheel
        run: |
          uv build
          python -m zipfile -l "$(find dist -name '*.whl' -print -quit)"
      - name: Validate shell syntax
        shell: pwsh
        run: |
          Get-ChildItem scripts -Recurse -Filter *.sh | ForEach-Object {
            bash -n $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "bash syntax failed: $($_.FullName)" }
          }
          Get-ChildItem scripts -Recurse -Filter *.ps1 | ForEach-Object {
            [void][scriptblock]::Create((Get-Content -Raw -LiteralPath $_.FullName))
          }
      - name: Lint workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
