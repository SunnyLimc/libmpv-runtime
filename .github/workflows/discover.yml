name: discover upstream candidates

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discover-upstream-candidates
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -e .
      - name: Resolve release channels to immutable candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: libmpv-runtime candidate discover --output candidates
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidates-${{ github.run_id }}
          path: candidates/*.json
          if-no-files-found: error
          retention-days: 14
