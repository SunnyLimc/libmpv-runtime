name: promote validated runtime

on:
  workflow_dispatch:
    inputs:
      validation_run_id:
        description: Successful validate-runtime-candidates run ID
        required: true
        type: string
      promotion_id:
        description: Immutable ID in runtime-YYYYMMDD.N form
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -e .
      - name: Verify validation run identity
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.validation_run_id }}
        run: |
          test "$(gh run view "$RUN_ID" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$RUN_ID" --json workflowName --jq .workflowName)" = 'validate runtime candidates'
          test "$(gh run view "$RUN_ID" --json headSha --jq .headSha)" = "$GITHUB_SHA"
      - name: Download one complete validation run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.validation_run_id }}
        run: gh run download "$RUN_ID" --dir validated
      - name: Assemble immutable promotion
        run: |
          mapfile -t windows < <(find validated -name 'libmpv-runtime-windows-x86_64.zip')
          mapfile -t android < <(find validated -name 'libmpv-runtime-android.zip')
          mapfile -t macos < <(find validated -name 'libmpv-runtime-macos*' ! -name '*.sha256')
          mapfile -t ios < <(find validated -name 'libmpv-runtime-ios*' ! -name '*.sha256')
          args=()
          for path in "${windows[@]}"; do args+=(--artifact "windows-x86_64=$path"); done
          for path in "${android[@]}"; do args+=(--artifact "android=$path"); done
          for path in "${macos[@]}"; do args+=(--artifact "macos=$path"); done
          for path in "${ios[@]}"; do args+=(--artifact "ios=$path"); done
          libmpv-runtime promotion assemble --id "${{ inputs.promotion_id }}" \
            "${args[@]}" \
            --evidence "windows-x86_64=$(find validated -name windows-x86_64.json -print -quit)" \
            --evidence "android=$(find validated -name android.json -print -quit)" \
            --evidence "macos=$(find validated -name macos.json -print -quit)" \
            --evidence "ios=$(find validated -name ios.json -print -quit)" \
            --linux-report "$(find validated -name linux-system.json -print -quit)" \
            --output release
          libmpv-runtime packages generate --promotion release/promotion.json --output release/packages
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find release/packages -mindepth 1 -maxdepth 1 -type d -print0 | \
            while IFS= read -r -d '' package; do
              (cd release/packages && zip -qr "../$(basename "$package").zip" "$(basename "$package")")
            done
          rm -rf release/packages
          gh release create "${{ inputs.promotion_id }}" release/* \
            --title "${{ inputs.promotion_id }}" --generate-notes
