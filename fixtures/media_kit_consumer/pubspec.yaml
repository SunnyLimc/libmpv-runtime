name: libmpv_runtime_consumer
publish_to: none
version: 0.0.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  # media_kit_video still uses CocoaPods on Apple platforms. Keep the runtime
  # plugin on the same integration path until that upstream plugin supports
  # Swift Package Manager, otherwise its linker cannot see the pod frameworks.
  config:
    enable-swift-package-manager: false
  uses-material-design: true
